jobs:
  job_name:
    tier: example_tier
    database: DB_EXAMPLE
    runner_script: /path/to/script
    n_sets: 9
    n_chains: 21
    input_directory: /path/to/calibration/files
    reporting_job: reporting_job_name
    init_name: calInit
    output_prefix: calOut
    extension: rdata
    # Optional job-specific override for shared_resources.group_access_path.
    # group_access_path: "PROJECT_ROOT:databases/job_name"
    params:
      seed: 1234
      tolerance: 0.001

resource_tiers:
  example_tier:
    cpus_per_task: 5
    mem: 8G
    time: "00:05:00"

shared_resources:
  partition: <partition>
  account: <account>
  output: sbaOut/output_%j.txt
  error: sbaOut/errors_%j.txt
  output_umask: "0007"
  # Optional; omit this and all job-specific overrides to skip chmod.
  group_access_path: "DATABASE:/"
  ntasks: 1
  nodes: 1

root_paths:
  DATABASE: /path/to/db
  PROJECT: /path/to/project
