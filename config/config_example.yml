jobs:
  job_name:
    entry_point: /path/to/script
    tier: example_tier
    database: DB_EXAMPLE
    runner_script: /path/to/script
    n_sets: 9
    n_chains: 21
    input_directory: /path/to/calibration/files
    reporting_job: reporting_job_name
    init_name: calInit
    output_prefix: calOut
    extension: rdata

resource_tiers:
  example_tier:
    cpus_per_task: 5
    mem: 8G
    time: "00:05:00"

shared_resources:
  partition: <partition>
  account: <account>
  output: sbaOut/output_%j.txt
  error: sbaOut/errors_%j.txt
  ntasks: 1
  nodes: 1

root_paths:
  DB_EXAMPLE: /path/to/db
